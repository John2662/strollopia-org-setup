    - Writing
    - Vocabulary
    - Grammar
  Location Type:
    - Market
    - Transport Hub
    - Historic Site
    - Cafe
    - Park
    - University
    - Street

mediatypes:
  - richtext
  - image
  - audio

layouts:
  text:
    - rt1:richtext
  text-audio:
    - rt1:richtext
    - a1:audio
  image:
    - rt1:richtext
    - i1:image
  full:
    - rt1:richtext
    - i1:image
    - a1:audio

org_maps:
